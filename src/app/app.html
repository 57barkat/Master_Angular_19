<div class="counter-wrapper">
  <h1>Counter App</h1>

  <div class="counter-display">Count: {{ count }}</div>

  <div class="counter-actions">
    <button (click)="handleClick('plus')" class="btn increment">
      + increment
    </button>
    <button
      (click)="handleClick('minus')"
      [disabled]="count === 0"
      class="btn decrement"
    >
      - decrement
    </button>
    <button (click)="handleClick('reset')" class="btn reset">⟲ reset</button>
  </div>
</div>
