<h1>{{ title }}</h1>

<div
  class="box"
  (mouseenter)="onMouseEnterEvent()"
  (mouseleave)="onMouseLeaveEvent()"
>
  Hover over me
</div>

<button (click)="onClickEvent()">Click Me</button>

<input
  [value]="inputText"
  (input)="onInputEvent($event)"
  placeholder="Type something..."
/>

<p>{{ message }}</p>
